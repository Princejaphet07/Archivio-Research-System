name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm --prefix public-archive install

      - name: Configure Production Environment Variables
        run: |
          echo "VITE_BACKEND_URL=https://archivio-email-service.onrender.com" > .env
          echo "VITE_BACKEND_URL=https://archivio-email-service.onrender.com" > public-archive/.env

      - name: Build Both Applications
        run: npm run build:all

      - name: Authenticate with Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting (Multi-Site)
        run: npx firebase-tools deploy --only hosting
